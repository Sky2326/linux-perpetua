# 放到 fork 仓库的 .github/workflows/ 下，然后在 Actions 里手动 Run workflow。
# 用途：在云端编译 linux-perpetua 的 iceland 内核，产出 Image / dtb / modules / manifest。
# 说明：本机是 Windows 且无 WSL/Docker，所以用 GitHub Actions 做 Linux + LLVM 交叉编译。
# v2: 内置 /chosen/fdt-handoff 身份补丁。实测本机 oplusboot.prjname=25927，
#     而官方 iceland DTS 只写 25978；三个 stock-* 是 AND，任一不命中内核就不接管设备树。
name: Build Perpetua kernel for iceland

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'linux-perpetua 分支'
        required: true
        default: 'perpetua/v7.3'
      device:
        description: 'devices/ 下的设备代号'
        required: true
        default: 'iceland'
      handoff_prjnames:
        description: 'fdt-handoff 项目号候选，逗号分隔（数组内是 OR）'
        required: true
        default: '25978,25927'
      handoff_models:
        description: 'fdt-handoff stock-model 候选，用 | 分隔（已按 OPD2513 实测值补齐）'
        required: true
        default: 'Qualcomm Technologies, Inc. Canoe MTP,iceland-O IN|Qualcomm Technologies, Inc. Canoe MTP,iceland-O'
      handoff_compatibles:
        description: 'fdt-handoff stock-compatible 候选，用 | 分隔（实测根 compatible 含 qcom,canoe，已命中）'
        required: true
        default: 'qcom,canoe'
      make_boot_image:
        description: '是否生成 boot.img（需先把原厂 boot.img 放进仓库 firmware/boot.img）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # `runner` is NOT available in jobs.<job_id>.env (GitHub: "Unrecognized
      # named-value: 'runner'"). Keep the out-of-tree build outside the source
      # tree, as devices/README does with ../build-iceland.
      BUILD: ${{ github.workspace }}/../build-iceland
      OUT: ${{ github.workspace }}/artifacts
      DTB: qcom/kaanapali-oneplus-iceland.dtb
      DTS: arch/arm64/boot/dts/qcom/kaanapali-oneplus-iceland.dts
      H_PRJ: ${{ inputs.handoff_prjnames }}
      H_MODEL: ${{ inputs.handoff_models }}
      H_COMPAT: ${{ inputs.handoff_compatibles }}
    steps:
      - name: Free runner disk space
        run: |
          # linux-perpetua is a full kernel tree; a stock ubuntu runner can run out mid-build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout linux-perpetua
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Patch fdt-handoff identity
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          dts = pathlib.Path(os.environ["DTS"])
          src = dts.read_text()

          def values(raw, sep):
              return [v.strip() for v in raw.split(sep) if v.strip()]

          def quote(v):
              return '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"'

          pairs = [
              ("stock-compatible", values(os.environ["H_COMPAT"], "|")),
              ("stock-model", values(os.environ["H_MODEL"], "|")),
              ("stock-bootargs",
               ["oplusboot.prjname=" + p for p in values(os.environ["H_PRJ"], ",")]),
          ]
          for key, items in pairs:
              assert items, f"{key}: no candidate values"
              line = f"{key} = " + ", ".join(quote(v) for v in items) + ";"
              pattern = re.compile(r"^(\s*)" + key + r"\s*=\s*[^;]+;", re.M)
              src, n = pattern.subn(lambda m: m.group(1) + line, src, count=1)
              assert n == 1, f"{key}: expected one assignment in the DTS, found {n}"
          dts.write_text(src)
          print("--- patched /chosen/fdt-handoff ---")
          block = src.split("fdt-handoff {", 1)[1].split("};", 1)[0]
          print(block.strip())
          PY
          mkdir -p "$OUT"
          cp "$DTS" "$OUT/kaanapali-oneplus-iceland.patched.dts"
          git diff -- "$DTS" > "$OUT/handoff.patch" || true

      - name: Install build dependencies (mirror fixed)
        run: |
          set -o pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Run #3 hung 20+ min; its log showed the same packages "Ign:"-retried
          # forever from http://azure.archive.ubuntu.com/ubuntu. That Azure
          # mirror is the fault, not the package set. lld/llvm/libelf-dev/dtc/
          # dwarves really are missing, so skipping apt is NOT an option:
          # LLVM=1 needs ld.lld to link the kernel. Point apt at the public
          # Ubuntu archive, then keep hard timeouts so it can never hang again.
          sudo systemctl stop unattended-upgrades apt-daily apt-daily-upgrade \
            2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service 2>/dev/null || true
          # Non-Ubuntu repos (Microsoft / GitHub CLI / PPAs) can also stall.
          for f in /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              ubuntu*) ;;
              *) sudo rm -f "$f" ;;
            esac
          done

          MIRROR=https://archive.ubuntu.com/ubuntu/
          curl -fsSI --max-time 15 "$MIRROR/dists/noble/InRelease" >/dev/null \
            || MIRROR=http://archive.ubuntu.com/ubuntu/
          echo "using Ubuntu mirror: $MIRROR"
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
                   /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            sudo sed -i -E \
              "s#https?://azure[.]archive[.]ubuntu[.]com/ubuntu/?#${MIRROR}#g" "$f"
          done
          sudo apt-get clean
          sudo rm -f /var/cache/apt/archives/partial/* 2>/dev/null || true
          echo "=== apt sources ==="
          grep -RhE '^(URIs:|deb )' /etc/apt/sources.list \
            /etc/apt/sources.list.d/ 2>/dev/null | head -10 || true

          missing=()
          need() { command -v "$1" >/dev/null 2>&1 || missing+=("$2"); }
          need clang   clang
          need ld.lld  lld
          need llvm-ar llvm
          need gcc     gcc
          need make    make
          need flex    flex
          need bison   bison
          need bc      bc
          need openssl openssl
          need python3 python3
          need git     git
          need curl    curl
          need zip     zip
          need zstd    zstd
          need dtc     device-tree-compiler
          need pahole  dwarves
          need depmod  kmod
          need cpio    cpio
          test -f /usr/include/openssl/ssl.h || missing+=(libssl-dev)
          test -f /usr/include/libelf.h      || missing+=(libelf-dev)
          if ((${#missing[@]})); then
            mapfile -t missing < <(printf '%s\n' "${missing[@]}" | sort -u)
            echo "missing packages: ${missing[*]}"
          fi

          APTOPT=(-o Acquire::Retries=0 -o Acquire::http::Timeout=20
                  -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=10)
          ok=1
          if ((${#missing[@]})); then
            ok=0
            # The index must be refreshed after rewriting the mirror URI.
            timeout 180 sudo apt-get "${APTOPT[@]}" update 2>&1 \
              | tee /tmp/apt-update.log || true
            if timeout 300 sudo apt-get "${APTOPT[@]}" install -y \
                 --no-install-recommends "${missing[@]}" 2>&1 \
                 | tee /tmp/apt-install.log; then
              ok=1
            else
              echo "::warning::apt install failed or hit the 300s timeout"
              tail -n 10 /tmp/apt-install.log | tr '\n' ' ' | sed 's/^/::notice::/'
              tail -n 6 /tmp/apt-update.log | tr '\n' ' ' | sed 's/^/::notice::/'
            fi
          else
            echo "nothing to install, apt skipped"
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::warning::依赖未装全，仍继续；toolchain report 会列出缺口"
          else
            echo "::notice::依赖就绪"
          fi

          # Some runner images only ship version-suffixed LLVM binaries
          # (llvm-ar-18, ...); LLVM=1 expects the unsuffixed names.
          for t in ar nm objcopy objdump strip readelf; do
            if ! command -v "llvm-$t" >/dev/null 2>&1; then
              cand=$(ls /usr/bin/llvm-"$t"-[0-9]* /usr/lib/llvm-*/bin/llvm-"$t" \
                     2>/dev/null | head -1)
              if [ -n "$cand" ]; then
                sudo ln -sf "$cand" "/usr/local/bin/llvm-$t"
              fi
            fi
          done

          echo "=== toolchain report ==="
          clang --version | head -2 || true
          ld.lld --version || true
          for c in clang ld.lld llvm-ar gcc make flex bison bc openssl python3 git dtc pahole; do
            if command -v "$c" >/dev/null 2>&1; then
              printf '  OK      %s -> %s\n' "$c" "$(command -v "$c")"
            else
              printf '  MISSING %s\n' "$c"
            fi
          done
          for h in /usr/include/openssl/ssl.h /usr/include/libelf.h; do
            test -f "$h" && echo "  OK      $h" || echo "  MISSING $h"
          done

      - name: Configure kernel
        run: |
          mkdir -p "$BUILD" "$OUT"
          ARCH=arm64 LLVM=1 devices/config "${{ inputs.device }}" "$BUILD"

      - name: Build device tree blob
        # Must exist before Image: CONFIG_BUILTIN_DTB_NAME links this dtb into
        # the kernel. devices/check verifies dtb bytes are present in Image.
        run: make ARCH=arm64 LLVM=1 O="$BUILD" "$DTB"

      - name: Build Image and modules
        run: |
          make ARCH=arm64 LLVM=1 O="$BUILD" -j"$(nproc)" Image modules
          make ARCH=arm64 LLVM=1 O="$BUILD" \
            INSTALL_MOD_PATH="${{ github.workspace }}/modules-root" modules_install

      - name: Verify handoff against the unit's own stock FDT
        if: ${{ hashFiles('firmware/stock.dtb') != '' }}
        continue-on-error: true
        run: |
          # 匹配判定发生在内存处理之前，所以物理地址可用 0 0 占位。
          # 退出码 0 = ready（内核接管内置树）；2 = not this device（不接管）。
          set +e
          devices/handoff/test \
            "$BUILD/arch/arm64/boot/dts/$DTB" \
            firmware/stock.dtb 0 0 "$OUT/handoff-output.dtb" \
            | tee "$OUT/handoff-test.txt"
          code=${PIPESTATUS[0]}
          echo "handoff_test_exit=$code" | tee -a "$OUT/handoff-test.txt"
          case "$code" in
            0) echo "::notice::ready: 内核会接管内置设备树" ;;
            2) echo "::error::not this device: 身份描述仍不匹配，不要刷这个 Image" ;;
            *) echo "::warning::匹配已通过（地址占位导致后续处理失败）；以首行 ready 为准" ;;
          esac

      - name: Collect artifacts
        run: |
          cp "$BUILD/arch/arm64/boot/Image" "$OUT/Image"
          cp "$BUILD/.config" "$OUT/kernel.config"
          cp "$BUILD/System.map" "$OUT/System.map" || true
          cp "$BUILD/Module.symvers" "$OUT/Module.symvers" || true
          find "$BUILD/arch/arm64/boot/dts" -name '*iceland*.dtb' \
            -exec cp {} "$OUT/" \; || true
          find "${{ github.workspace }}/modules-root/lib/modules" -type f \
            -exec sha256sum {} + | sed "s#${{ github.workspace }}/modules-root/##" \
            > "$OUT/modules.sha256" || true
          # Perpetua ships no rootfs: these modules must be copied into
          # /usr/lib/modules of the system image at the same kernel release.
          tar --zstd -cf "$OUT/modules.tar.zst" \
            -C "${{ github.workspace }}/modules-root/lib" modules || true
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = os.environ["OUT"]
          files = {}
          for name in sorted(os.listdir(out)):
              p = os.path.join(out, name)
              if os.path.isfile(p):
                  files[name] = hashlib.sha256(open(p, "rb").read()).hexdigest()
          # The O= directory has no usable Makefile for a bare `make`; read the
          # release Kbuild already wrote instead.
          kr = Path(os.environ["BUILD"]) / "include/config/kernel.release"
          release = kr.read_text().strip() if kr.is_file() else "unknown"
          manifest = {
              "device": os.environ.get("DEVICE", "iceland"),
              "release": release,
              "source": "denialwm/linux-perpetua@" + os.environ["GITHUB_SHA"],
              "handoff_models": os.environ["H_MODEL"],
              "handoff_prjnames": os.environ["H_PRJ"],
              "sha256": files,
          }
          with open(os.path.join(out, "manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
        env:
          DEVICE: ${{ inputs.device }}

      - name: Generate boot.img from the stock image
        if: ${{ inputs.make_boot_image }}
        run: |
          test -f firmware/boot.img || {
            echo "::error::把原厂 boot.img 放到 firmware/boot.img 后再开启本步骤"; exit 1; }
          # avbtool / unpack_bootimg come from AOSP, not apt. Their real names
          # are usually avbtool.py and unpack_bootimg.py, but android-gki calls
          # them without the suffix. Build wrappers that work either way.
          git clone --quiet --depth 1 https://android.googlesource.com/platform/external/avb \
            "$RUNNER_TEMP/avb"
          git clone --quiet --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg \
            "$RUNNER_TEMP/mkbootimg"
          mkdir -p "$RUNNER_TEMP/bin"
          AVB=$(ls "$RUNNER_TEMP/avb"/avbtool "$RUNNER_TEMP/avb"/avbtool.py 2>/dev/null | head -1)
          UNPACK=$(ls "$RUNNER_TEMP/mkbootimg"/unpack_bootimg \
                      "$RUNNER_TEMP/mkbootimg"/unpack_bootimg.py 2>/dev/null | head -1)
          test -n "$AVB" || { echo "::error::avbtool missing from external/avb"; ls "$RUNNER_TEMP/avb"; exit 1; }
          test -n "$UNPACK" || { echo "::error::unpack_bootimg missing from system/tools/mkbootimg"; ls "$RUNNER_TEMP/mkbootimg"; exit 1; }
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' "$AVB" > "$RUNNER_TEMP/bin/avbtool"
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' "$UNPACK" > "$RUNNER_TEMP/bin/unpack_bootimg"
          chmod +x "$RUNNER_TEMP/bin/avbtool" "$RUNNER_TEMP/bin/unpack_bootimg"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          command -v avbtool && command -v unpack_bootimg
          mkdir -p "$OUT/evidence"
          # 官方用法: android-gki boot|init_boot TEMPLATE PAYLOAD OUTPUT [EVIDENCE]
          python3 devices/boot/android-gki boot \
            firmware/boot.img "$OUT/Image" "$OUT/boot.img" "$OUT/evidence"
          sha256sum "$OUT/boot.img" | tee "$OUT/boot.img.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perpetua-${{ inputs.device }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
