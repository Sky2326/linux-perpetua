# 放到 fork 仓库的 .github/workflows/ 下，然后在 Actions 里手动 Run workflow。
# 用途：在云端编译 linux-perpetua 的 iceland 内核，产出 Image / dtb / modules / manifest。
# 说明：本机是 Windows 且无 WSL/Docker，所以用 GitHub Actions 做 Linux + LLVM 交叉编译。
# v2: 内置 /chosen/fdt-handoff 身份补丁。实测本机 oplusboot.prjname=25927，
#     而官方 iceland DTS 只写 25978；三个 stock-* 是 AND，任一不命中内核就不接管设备树。
# v2.8: run#6 暴露真实报错 "Linker is too old / Your LLD version: 16.0.6 /
#     Minimum LLD version: 17.0.1"。原因是软链用 head -1 选中了最老的
#     ld.lld-16，且 /usr/local/bin 会遮蔽 apt 新装的 ld.lld。现改为始终对齐
#     镜像上最高版本 LLVM，必要时从第三方镜像装 lld-18，并在 configure 前
#     做版本断言（<17 直接 fail-fast）。
name: Build Perpetua kernel for iceland

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'linux-perpetua 分支'
        required: true
        default: 'perpetua/v7.3'
      device:
        description: 'devices/ 下的设备代号'
        required: true
        default: 'iceland'
      handoff_prjnames:
        description: 'fdt-handoff 项目号候选，逗号分隔（数组内是 OR）'
        required: true
        default: '25978,25927'
      handoff_models:
        description: 'fdt-handoff stock-model 候选，用 | 分隔（已按 OPD2513 实测值补齐）'
        required: true
        default: 'Qualcomm Technologies, Inc. Canoe MTP,iceland-O IN|Qualcomm Technologies, Inc. Canoe MTP,iceland-O'
      handoff_compatibles:
        description: 'fdt-handoff stock-compatible 候选，用 | 分隔（实测根 compatible 含 qcom,canoe，已命中）'
        required: true
        default: 'qcom,canoe'
      make_boot_image:
        description: '是否生成 boot.img（需先把原厂 boot.img 放进仓库 firmware/boot.img）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # `runner` is NOT available in jobs.<job_id>.env (GitHub: "Unrecognized
      # named-value: 'runner'"). Keep the out-of-tree build outside the source
      # tree, as devices/README does with ../build-iceland.
      BUILD: ${{ github.workspace }}/../build-iceland
      OUT: ${{ github.workspace }}/artifacts
      DTB: qcom/kaanapali-oneplus-iceland.dtb
      DTS: arch/arm64/boot/dts/qcom/kaanapali-oneplus-iceland.dts
      H_PRJ: ${{ inputs.handoff_prjnames }}
      H_MODEL: ${{ inputs.handoff_models }}
      H_COMPAT: ${{ inputs.handoff_compatibles }}
    steps:
      - name: Free runner disk space
        run: |
          # linux-perpetua is a full kernel tree; a stock ubuntu runner can run out mid-build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout linux-perpetua
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Patch fdt-handoff identity
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          dts = pathlib.Path(os.environ["DTS"])
          src = dts.read_text()

          def values(raw, sep):
              return [v.strip() for v in raw.split(sep) if v.strip()]

          def quote(v):
              return '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"'

          pairs = [
              ("stock-compatible", values(os.environ["H_COMPAT"], "|")),
              ("stock-model", values(os.environ["H_MODEL"], "|")),
              ("stock-bootargs",
               ["oplusboot.prjname=" + p for p in values(os.environ["H_PRJ"], ",")]),
          ]
          for key, items in pairs:
              assert items, f"{key}: no candidate values"
              line = f"{key} = " + ", ".join(quote(v) for v in items) + ";"
              pattern = re.compile(r"^(\s*)" + key + r"\s*=\s*[^;]+;", re.M)
              src, n = pattern.subn(lambda m: m.group(1) + line, src, count=1)
              assert n == 1, f"{key}: expected one assignment in the DTS, found {n}"
          dts.write_text(src)
          print("--- patched /chosen/fdt-handoff ---")
          block = src.split("fdt-handoff {", 1)[1].split("};", 1)[0]
          print(block.strip())
          PY
          mkdir -p "$OUT"
          cp "$DTS" "$OUT/kaanapali-oneplus-iceland.patched.dts"
          git diff -- "$DTS" > "$OUT/handoff.patch" || true

      - name: Install build dependencies (third-party mirrors)
        run: |
          set -o pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Run #4: v2.4 rewrote sources.list*, but Ubuntu 24.04 hosted runners
          # use "mirror+file:/etc/apt/apt-mirrors.txt" -- the Azure hostname is
          # inside THAT file, so apt still failed with "Temporary failure
          # resolving 'azure.archive.ubuntu.com'". lld/llvm/flex/bison never
          # installed, and Configure kernel then died with exit 2.
          # v2.5: ignore every system source and hand apt one explicit list.
          # v2.6: user asked for NO Ubuntu-owned mirrors at all, so the list
          # is built from a probed third-party mirror, with no fallback to
          # archive.ubuntu.com / azure.archive.ubuntu.com under any condition.
          sudo systemctl stop unattended-upgrades apt-daily apt-daily-upgrade \
            2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service 2>/dev/null || true

          # User asked to stop using Ubuntu's own mirrors entirely: no
          # archive.ubuntu.com, no azure.archive.ubuntu.com, no fallback to
          # either. Probe independent third-party mirrors and pick the fastest
          # one that answers on THIS runner. GitHub-hosted runners sit in
          # Azure US, so a CN mirror that is fast from China may not be fast
          # there -- never hard-code a single mirror.
          CANDIDATES=(
            https://mirrors.aliyun.com/ubuntu/
            https://mirrors.cloud.tencent.com/ubuntu/
            https://repo.huaweicloud.com/ubuntu/
            https://mirrors.tuna.tsinghua.edu.cn/ubuntu/
            https://mirrors.ustc.edu.cn/ubuntu/
            https://mirrors.mit.edu/ubuntu/
            https://ubuntu.mirrors.ovh.net/ubuntu/
          )
          : > /tmp/mirror-ok.txt
          probe_summary=""
          for u in "${CANDIDATES[@]}"; do
            out=$(curl -sS --connect-timeout 5 --max-time 10 \
              -o /dev/null -w "%{http_code} %{time_total}" \
              "${u}dists/noble/InRelease" 2>/dev/null) || out="000 99"
            code=${out%% *}
            tm=${out##* }
            [ -n "$code" ] || code=000
            case "$code" in
              200) echo "$tm $u" >> /tmp/mirror-ok.txt
                   probe_summary="$probe_summary ${u##*//}:OK/${tm}s" ;;
              *)   probe_summary="$probe_summary ${u##*//}:FAIL/$code" ;;
            esac
          done
          echo "mirror probe:$probe_summary"
          echo "::notice::mirror probe:$probe_summary"
          BASE=
          if [ -s /tmp/mirror-ok.txt ]; then
            BASE=$(sort -n /tmp/mirror-ok.txt | head -1 | awk '{print $2}')
          fi
          if [ -z "$BASE" ]; then
            echo "::error::所有第三方镜像均不可达；按你的要求不回退 Ubuntu 官方源"
            echo "::error::请在 CANDIDATES 里补一个该 runner 能访问的镜像后重跑"
          else
            echo "selected Ubuntu mirror: $BASE (fastest responding)"
            echo "::notice::selected Ubuntu mirror: $BASE"
          fi

          # One explicit isolated list: system sources (including the broken
          # mirror+file:/etc/apt/apt-mirrors.txt) are never consulted.
          write_sources() {
            local comps=("$@")
            : > /tmp/ubuntu-thirdparty.list
            for c in "${comps[@]}"; do
              printf 'deb [trusted=yes] %s %s main restricted universe multiverse\n' \
                "$BASE" "$c" >> /tmp/ubuntu-thirdparty.list
            done
            cat /tmp/ubuntu-thirdparty.list
          }
          # trusted=yes: one-shot CI runner, avoids keyring/path differences
          # between deb822 and legacy .list sources.
          if [ -n "$BASE" ]; then
            write_sources noble noble-updates noble-security
          else
            : > /tmp/ubuntu-thirdparty.list
          fi
          APT_SRC=(-o Dir::Etc::sourcelist=/tmp/ubuntu-thirdparty.list
                  -o Dir::Etc::sourceparts=-
                  -o APT::Get::List-Cleanup=0)
          # Drop every cached index: stale Azure entries would otherwise make
          # apt fetch packages from azure.archive.ubuntu.com again.
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial
          sudo apt-get clean
          sudo rm -f /var/cache/apt/archives/partial/* 2>/dev/null || true

          # run#6 root cause: `ls ld.lld-[0-9]* | head -1` picked the OLDEST
          # linker on the image (/usr/bin/ld.lld-16 = LLD 16.0.6) while clang
          # is 18.1.3. /usr/local/bin shadows /usr/bin, so even a freshly
          # installed lld would have been ignored. Kconfig requires
          # LLD >= 17.0.1 and failed with "Sorry, this linker is not supported."
          # Always align the unsuffixed tools to the HIGHEST LLVM on disk.
          align_llvm() {
            local v p best=0 lld="" t src
            for v in 22 21 20 19 18 17 16 15 14; do
              for p in "/usr/bin/ld.lld-$v" "/usr/lib/llvm-$v/bin/ld.lld"; do
                if [ -x "$p" ] && [ "$v" -gt "$best" ]; then best=$v; lld=$p; fi
              done
            done
            [ -n "$lld" ] || return 1
            sudo ln -sf "$lld" /usr/local/bin/ld.lld
            for t in ar nm objcopy objdump strip readelf; do
              for src in "/usr/bin/llvm-$t-$best" "/usr/lib/llvm-$best/bin/llvm-$t"; do
                if [ -x "$src" ]; then
                  sudo ln -sf "$src" "/usr/local/bin/llvm-$t"
                  break
                fi
              done
            done
            echo "aligned LLVM tools to $best via $lld"
            echo "::notice::aligned LLVM tools to $best via $lld"
          }
          lld_major() {
            ld.lld --version 2>/dev/null \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d. -f1
          }
          align_llvm || echo "::warning::no versioned ld.lld yet; apt will install one"

          missing=()
          need() { command -v "$1" >/dev/null 2>&1 || missing+=("$2"); }
          need clang   clang
          need ld.lld  lld
          need llvm-ar llvm
          need gcc     gcc
          need make    make
          need flex    flex
          need bison   bison
          need bc      bc
          need openssl openssl
          need python3 python3
          need git     git
          need curl    curl
          need zip     zip
          need zstd    zstd
          need dtc     device-tree-compiler
          need pahole  dwarves
          need depmod  kmod
          need cpio    cpio
          test -f /usr/include/openssl/ssl.h || missing+=(libssl-dev)
          test -f /usr/include/libelf.h      || missing+=(libelf-dev)
          # An old ld.lld is NOT solved by the bare `lld` metapackage: the
          # stale /usr/local/bin/ld.lld symlink would keep shadowing it.
          # Explicitly request lld-18 from the selected third-party noble mirror.
          cur_major=$(lld_major || true)
          if [ -z "$cur_major" ] || [ "$cur_major" -lt 17 ]; then
            echo "::notice::LLD ${cur_major:-missing} < 17; requesting lld-18"
            missing+=(lld-18)
          fi
          if ((${#missing[@]})); then
            mapfile -t missing < <(printf '%s\n' "${missing[@]}" | sort -u)
            echo "missing packages: ${missing[*]}"
          fi

          APTOPT=(-o Acquire::Retries=0 -o Acquire::http::Timeout=20
                  -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=10)
          ok=1
          if ((${#missing[@]})) && [ -n "$BASE" ]; then
            ok=0
            update_ok=0
            # Fresh index from the isolated third-party list only.
            if timeout 180 sudo apt-get "${APT_SRC[@]}" "${APTOPT[@]}" update \
                 2>&1 | tee /tmp/apt-update.log; then
              update_ok=1
            else
              echo "::warning::apt update 失败，去掉 noble-security 组件重试"
              tail -n 6 /tmp/apt-update.log | tr '\n' ' ' | sed 's/^/::notice::/'
              write_sources noble noble-updates
              if timeout 180 sudo apt-get "${APT_SRC[@]}" "${APTOPT[@]}" update \
                   2>&1 | tee /tmp/apt-update.log; then
                update_ok=1
              else
                tail -n 6 /tmp/apt-update.log | tr '\n' ' ' | sed 's/^/::notice::/'
              fi
            fi
            if [ "$update_ok" -eq 1 ]; then
              if timeout 300 sudo apt-get "${APT_SRC[@]}" "${APTOPT[@]}" \
                   install -y --no-install-recommends "${missing[@]}" 2>&1 \
                   | tee /tmp/apt-install.log; then
                ok=1
              else
                echo "::warning::apt install failed or hit the 300s timeout"
                tail -n 10 /tmp/apt-install.log | tr '\n' ' ' | sed 's/^/::notice::/'
              fi
            fi
          elif ((${#missing[@]})); then
            ok=0
            echo "::warning::无可用第三方镜像，跳过 apt；缺口见 toolchain report"
          else
            echo "nothing to install, apt skipped"
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::warning::依赖未装全，仍继续；toolchain report 会列出缺口"
          else
            echo "::notice::依赖就绪"
          fi

          # Re-align after apt: lld-18 may have just landed. Fail fast here
          # instead of letting Configure kernel die with another bare exit 2.
          align_llvm || { echo "::error::no ld.lld available after apt"; exit 1; }
          final_major=$(lld_major || true)
          echo "::notice::ld.lld -> $(readlink -f "$(command -v ld.lld)") | $(ld.lld --version | head -1)"
          if [ -z "$final_major" ] || [ "$final_major" -lt 17 ]; then
            echo "::error::LLD ${final_major:-missing} < 17.0.1 required by this kernel; abort before configure"
            exit 1
          fi

          echo "=== toolchain report ==="
          clang --version | head -2 || true
          ld.lld --version || true
          # Emit MISSING as annotations: job logs need admin rights to read,
          # but check-run annotations are visible to everyone (and to me).
          for c in clang ld.lld llvm-ar gcc make flex bison bc openssl python3 git dtc pahole; do
            if command -v "$c" >/dev/null 2>&1; then
              printf '  OK      %s -> %s\n' "$c" "$(command -v "$c")"
            else
              printf '  MISSING %s\n' "$c"
              echo "::warning::missing tool: $c"
            fi
          done
          for h in /usr/include/openssl/ssl.h /usr/include/libelf.h; do
            if [ -f "$h" ]; then
              echo "  OK      $h"
            else
              echo "  MISSING $h"
              echo "::warning::missing header: $h"
            fi
          done

      - name: Configure kernel
        run: |
          mkdir -p "$BUILD" "$OUT"
          set +e
          # devices/config only redirects merge_config.sh's STDOUT into
          # devices-config.log. make's real error goes to STDERR and was lost,
          # which is why run#5 showed nothing but a bare "exit 2" even though
          # all dependencies were installed. Capture both streams here.
          ARCH=arm64 LLVM=1 devices/config "${{ inputs.device }}" "$BUILD" \
            > "$BUILD/configure-stdout.log" 2> "$BUILD/configure-stderr.log"
          rc=$?
          set -e
          cat "$BUILD/configure-stderr.log" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::devices/config failed with exit $rc"
            for f in configure-stderr.log devices-config.log configure-stdout.log; do
              p="$BUILD/$f"
              [ -f "$p" ] || continue
              echo "=== $f (tail) ==="
              tail -n 80 "$p" | while IFS= read -r line; do echo "::notice::$line"; done
            done
            ls -l "$BUILD/.config" 2>/dev/null || echo "no .config produced"
            exit "$rc"
          fi
          echo "kernel config generated"

      - name: Build device tree blob
        # Must exist before Image: CONFIG_BUILTIN_DTB_NAME links this dtb into
        # the kernel. devices/check verifies dtb bytes are present in Image.
        run: make ARCH=arm64 LLVM=1 O="$BUILD" "$DTB"

      - name: Build Image and modules
        run: |
          make ARCH=arm64 LLVM=1 O="$BUILD" -j"$(nproc)" Image modules
          make ARCH=arm64 LLVM=1 O="$BUILD" \
            INSTALL_MOD_PATH="${{ github.workspace }}/modules-root" modules_install

      - name: Verify handoff against the unit's own stock FDT
        if: ${{ hashFiles('firmware/stock.dtb') != '' }}
        continue-on-error: true
        run: |
          # 匹配判定发生在内存处理之前，所以物理地址可用 0 0 占位。
          # 退出码 0 = ready（内核接管内置树）；2 = not this device（不接管）。
          set +e
          devices/handoff/test \
            "$BUILD/arch/arm64/boot/dts/$DTB" \
            firmware/stock.dtb 0 0 "$OUT/handoff-output.dtb" \
            | tee "$OUT/handoff-test.txt"
          code=${PIPESTATUS[0]}
          echo "handoff_test_exit=$code" | tee -a "$OUT/handoff-test.txt"
          case "$code" in
            0) echo "::notice::ready: 内核会接管内置设备树" ;;
            2) echo "::error::not this device: 身份描述仍不匹配，不要刷这个 Image" ;;
            *) echo "::warning::匹配已通过（地址占位导致后续处理失败）；以首行 ready 为准" ;;
          esac

      - name: Collect artifacts
        run: |
          cp "$BUILD/arch/arm64/boot/Image" "$OUT/Image"
          cp "$BUILD/.config" "$OUT/kernel.config"
          cp "$BUILD/System.map" "$OUT/System.map" || true
          cp "$BUILD/Module.symvers" "$OUT/Module.symvers" || true
          find "$BUILD/arch/arm64/boot/dts" -name '*iceland*.dtb' \
            -exec cp {} "$OUT/" \; || true
          find "${{ github.workspace }}/modules-root/lib/modules" -type f \
            -exec sha256sum {} + | sed "s#${{ github.workspace }}/modules-root/##" \
            > "$OUT/modules.sha256" || true
          # Perpetua ships no rootfs: these modules must be copied into
          # /usr/lib/modules of the system image at the same kernel release.
          tar --zstd -cf "$OUT/modules.tar.zst" \
            -C "${{ github.workspace }}/modules-root/lib" modules || true
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = os.environ["OUT"]
          files = {}
          for name in sorted(os.listdir(out)):
              p = os.path.join(out, name)
              if os.path.isfile(p):
                  files[name] = hashlib.sha256(open(p, "rb").read()).hexdigest()
          # The O= directory has no usable Makefile for a bare `make`; read the
          # release Kbuild already wrote instead.
          kr = Path(os.environ["BUILD"]) / "include/config/kernel.release"
          release = kr.read_text().strip() if kr.is_file() else "unknown"
          manifest = {
              "device": os.environ.get("DEVICE", "iceland"),
              "release": release,
              "source": "denialwm/linux-perpetua@" + os.environ["GITHUB_SHA"],
              "handoff_models": os.environ["H_MODEL"],
              "handoff_prjnames": os.environ["H_PRJ"],
              "sha256": files,
          }
          with open(os.path.join(out, "manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
        env:
          DEVICE: ${{ inputs.device }}

      - name: Generate boot.img from the stock image
        if: ${{ inputs.make_boot_image }}
        run: |
          test -f firmware/boot.img || {
            echo "::error::把原厂 boot.img 放到 firmware/boot.img 后再开启本步骤"; exit 1; }
          # avbtool / unpack_bootimg come from AOSP, not apt. Their real names
          # are usually avbtool.py and unpack_bootimg.py, but android-gki calls
          # them without the suffix. Build wrappers that work either way.
          git clone --quiet --depth 1 https://android.googlesource.com/platform/external/avb \
            "$RUNNER_TEMP/avb"
          git clone --quiet --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg \
            "$RUNNER_TEMP/mkbootimg"
          mkdir -p "$RUNNER_TEMP/bin"
          AVB=$(ls "$RUNNER_TEMP/avb"/avbtool "$RUNNER_TEMP/avb"/avbtool.py 2>/dev/null | head -1)
          UNPACK=$(ls "$RUNNER_TEMP/mkbootimg"/unpack_bootimg \
                      "$RUNNER_TEMP/mkbootimg"/unpack_bootimg.py 2>/dev/null | head -1)
          test -n "$AVB" || { echo "::error::avbtool missing from external/avb"; ls "$RUNNER_TEMP/avb"; exit 1; }
          test -n "$UNPACK" || { echo "::error::unpack_bootimg missing from system/tools/mkbootimg"; ls "$RUNNER_TEMP/mkbootimg"; exit 1; }
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' "$AVB" > "$RUNNER_TEMP/bin/avbtool"
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' "$UNPACK" > "$RUNNER_TEMP/bin/unpack_bootimg"
          chmod +x "$RUNNER_TEMP/bin/avbtool" "$RUNNER_TEMP/bin/unpack_bootimg"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          command -v avbtool && command -v unpack_bootimg
          mkdir -p "$OUT/evidence"
          # 官方用法: android-gki boot|init_boot TEMPLATE PAYLOAD OUTPUT [EVIDENCE]
          python3 devices/boot/android-gki boot \
            firmware/boot.img "$OUT/Image" "$OUT/boot.img" "$OUT/evidence"
          sha256sum "$OUT/boot.img" | tee "$OUT/boot.img.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perpetua-${{ inputs.device }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
